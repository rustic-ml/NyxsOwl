[workspace]
members = ["nyxs_owl"]
resolver = "2"

[workspace.dependencies]
# Testing and benchmarking
rstest = "0.23"
criterion = "0.5"
proptest = "1.7"
mockall = "0.13"
pretty_assertions = "1.4"
tempfile = "3.14"
approx = "0.5"
quickcheck = "1.0"
fake = "2.10"

[workspace.metadata.tarpaulin]
exclude-files = ["examples/**/*", "benches/**/*", "*/build.rs"]
timeout = "300"
coverage-threshold = 80.0
fail-under = 80
run-types = ["Tests", "Doctests"]
output-format = ["Html", "Xml", "Json", "Lcov"]

[workspace.metadata.coverage]
exclude-line = [
    "#\\[cfg\\(test\\)\\]",
    "unreachable!",
    "unimplemented!",
    "todo!",
    "panic!",
]
