[package]
name = "nyxs_owl"
version = "0.5.0"
edition = "2021"
description = "A comprehensive Rust library for trading, forecasting, and financial analysis"
authors = ["Celsis Durham <durhamcelsis@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rustic-ml/NyxsOwl"
readme = "../README.md"
keywords = ["trading", "finance", "algorithms", "forecasting", "strategies"]
categories = ["finance", "algorithms"]
exclude = [
    # Build and target directories
    "target*/",
    "target/**/*",
    "Cargo.lock",
    
    # Git and version control
    ".git*",
    ".github/**/*",
    
    # IDE and editor files
    ".vscode/**/*", ".idea/**/*", ".vim/**/*", ".emacs.d/**/*",
    "*.swp", "*.swo", "*~",
    
    # OS-specific files
    ".DS_Store", "Thumbs.db", "desktop.ini", "*.lnk",
    
    # Media files
    "*.jpg", "*.jpeg", "*.png", "*.gif", "*.bmp", "*.tiff", "*.svg",
    
    # Data and configuration files
    "*.csv", "*.json", "*.xml", "*.y*ml", "*.db", "*.sqlite*",
    ".env*", "config.local.*",
    
    # Build artifacts and backups
    "*.profraw", "*.bak", "*.orig", "*.rej", "*.toml.bak",
    
    # Log and temporary files
    "*.log", "*.out", "*.err", "*.tmp", "*.temp", "*.cache",
    
    # Test and coverage output
    "coverage/**/*", "tarpaulin-report.html", "cobertura.xml", "lcov.info",
    "*.gcda", "*.gcno", "*.profdata",
    
    # Documentation builds
    "docs/**/*", "doc/**/*", "book/**/*", "_build/**/*",
    
    # Benchmark and profiling
    "criterion/**/*", "flamegraph.svg", "perf.data*",
    
    # Development tools and scripts
    "scripts/**/*", "tools/**/*", "ci/**/*", "run_coverage.sh",
    
    # Example data directories
    "examples/csv/**/*", "examples/data/**/*", "examples/output/**/*",
    
    # Archive files
    "*.zip", "*.tar.*", "*.7z", "*.rar",
    
    # Rust-specific files
    "rust-toolchain*", ".cargo/config*",
    
    # Security files
    "*.pem", "*.key", "*.crt", "*.p12", "*.pfx",
    
    # Development documentation
    "../*.md",
    "CHANGELOG.md", "CONTRIBUTING.md", "CODE_OF_CONDUCT.md",
]

[dependencies]
# Core dependencies
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
csv = "1.2"
rand = "0.8"

# Async support for better integration
async-trait = "0.1"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread"], optional = true }

# Math and statistics
num-traits = "0.2"
statrs = "0.16"
rand_distr = "0.4"

# Data processing
polars = { version = "0.47.1", features = ["lazy", "strings", "temporal", "rolling_window", "parquet", "dtype-categorical", "dtype-struct", "dtype-full", "csv"] }

# Technical analysis
ta-lib-in-rust = "1.0.8"

# Forecasting - Using published version
oxidiviner = "0.4.3"

# Logging and error handling for production
log = "0.4"
env_logger = "0.10"
anyhow = "1.0"

[dev-dependencies]
# Core testing framework
rstest = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
approx = { workspace = true }

# Property-based testing
proptest = { workspace = true }
quickcheck = { workspace = true }

# Mock testing
mockall = { workspace = true }

# Benchmarking
criterion = { workspace = true }

# Test data generation
fake = { workspace = true }

# Additional testing utilities
serial_test = "3.0"
tokio-test = "0.4"

# Working examples demonstrating NyxsOwl trade_math functionality
[[example]]
name = "trade_math_demo"
path = "examples/trade_math_demo.rs"

[[example]]
name = "comprehensive_trading_analysis"
path = "examples/comprehensive_trading_analysis.rs"

[[example]]
name = "performance_monitoring"
path = "examples/performance_monitoring.rs"

[[example]]
name = "forecasting_example"
path = "examples/forecasting_example.rs"

[[example]]
name = "lib_check"
path = "examples/lib_check.rs"

# Benchmarks for performance testing
[[bench]]
name = "trade_math_bench"
harness = false

[[bench]]
name = "forecast_bench"
harness = false

# Optional features that can be enabled by users
[features]
# Smart defaults for most users - includes essential technical analysis and backtesting
default = ["trading-math", "backtesting"]

# Core feature sets
trading-math = []          # Essential technical indicators (SMA, EMA, RSI, Bollinger Bands, etc.)
backtesting = []           # Strategy backtesting engine
forecasting = []           # Time series forecasting with OxiDiviner

# Advanced features
day-trading = []           # Day trading strategies using daily OHLCV data
minute-trading = []        # Minute-level intraday trading strategies
async-support = ["tokio"]  # Async runtime support for integration

# Convenience meta-features
basic = ["trading-math"]                                           # Just technical indicators
standard = ["trading-math", "backtesting"]                        # Technical analysis + backtesting
advanced = ["trading-math", "backtesting", "forecasting"]         # Standard + forecasting
professional = ["trading-math", "backtesting", "forecasting", "day-trading", "minute-trading"]  # Everything
all = ["professional", "async-support"]                           # Everything including async

[package.metadata.tarpaulin]
# Package-specific tarpaulin settings
exclude-files = [
    "examples/**/*",
    "benches/**/*",
]
timeout = "300"

[[example]]
name = "backtest_integration_demo"
path = "examples/backtest_integration_demo.rs"

[[example]]
name = "quick_start"
path = "examples/quick_start.rs"

# Removed debug_timeseries example 